plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.hongseob'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	jjwtVersion = '0.12.6'
	testcontainersVersion = '1.21.3'
	// SPEC-ENROLLMENT-001 plan.md §D ArchUnit 예외 각주 — 테스트 스코프 검증
	// 의존성이며 "신규 인프라 추가 금지" 제약의 대상이 아니다. 이 SPEC의 워커
	// 패키지 한정 규칙(AC-ENR-005/009) 검증에 실제로 필요하다.
	archUnitVersion = '1.3.0'
}

dependencies {
	testImplementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	// SPEC-AUTH-001 in-place amendment (2026-08-30) — TestRestTemplate 기반 실서버
	// (RANDOM_PORT) 회귀 테스트에 필요. spring-boot-resttestclient의
	// TestRestTemplateTestAutoConfiguration이 참조하는 RestTemplateBuilder는
	// Spring Boot 4 모듈화에서 spring-boot-restclient로 분리되어 있다.
	testImplementation 'org.springframework.boot:spring-boot-restclient'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation "com.tngtech.archunit:archunit-junit5:${archUnitVersion}"
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}
