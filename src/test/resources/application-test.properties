# test 프로파일 전용 JWT 서명 비밀키. 테스트 소스 트리에만 존재하며 프로덕션 코드가
# 아니다 (AC-AUTH-009 — 서명 비밀키 리터럴은 프로덕션 코드에서만 금지된다).
app.jwt.secret=test-only-jwt-signing-secret-for-spec-auth-001-do-not-reuse
app.jwt.access-token-ttl=30m

# test 프로파일 전용 관리자 시더 계정. 테스트 소스 트리에만 존재하며 프로덕션
# 코드가 아니다 (AC-AUTH-016 — 초기 비밀번호 리터럴은 프로덕션 코드에서만 금지된다).
app.admin.email=admin@spec-auth-001.test
app.admin.password=test-only-admin-password-for-spec-auth-001-do-not-reuse
