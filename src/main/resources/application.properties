spring.application.name=openclass-ap
spring.profiles.active=local

# TEMPORARY (SPEC-AUTH-001 M1 only) — spring-boot-starter-security is on the
# classpath (needed for BCryptPasswordEncoder), but no SecurityFilterChain
# bean exists yet (that is M3 scope: plan.md §C.3 / §F M3). Without this
# exclude, Spring Boot's default security autoconfiguration locks every
# endpoint behind basic auth + CSRF, breaking the still-public signup API
# (plan.md M1 — "no HTTP-layer authorization yet"). M3 MUST remove this line
# once SecurityConfig defines an explicit SecurityFilterChain bean.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration,org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration,org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration

# JWT 서명 비밀키는 프로퍼티(환경변수)로만 주입한다 — 소스 코드에 리터럴로 두지 않는다
# (REQ-LOGIN-004 / AC-AUTH-009). 로컬 개발은 application-local.properties(gitignore
# 대상)에서 app.jwt.secret을 직접 지정한다.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:30m}
