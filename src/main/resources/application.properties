spring.application.name=openclass-ap
spring.profiles.active=local

# M3: SecurityConfig가 명시적 SecurityFilterChain Bean을 정의하므로(경로별 인가 +
# STATELESS + 커스텀 401/403 처리) M1 임시 조치였던 spring.autoconfigure.exclude
# 줄을 제거했다 — 더 이상 Spring Boot 기본 시큐리티 자동설정에 의존하지 않는다.

# JWT 서명 비밀키는 프로퍼티(환경변수)로만 주입한다 — 소스 코드에 리터럴로 두지 않는다
# (REQ-LOGIN-004 / AC-AUTH-009). 로컬 개발은 application-local.properties(gitignore
# 대상)에서 app.jwt.secret을 직접 지정한다.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:30m}

# 최초 관리자 계정 시더 설정 (plan.md §C.4 / AC-AUTH-016). 비밀번호는 위 JWT
# 서명 비밀키와 동일한 패턴으로 프로퍼티(환경변수)로만 주입한다 — 소스 코드에
# 리터럴로 두지 않는다. 로컬 개발은 application-local.properties(gitignore
# 대상)에서 app.admin.password를 직접 지정한다.
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# CORS 허용 Origin 목록 (SPEC-FRONTEND-001 research.md §2 DEP-1). 콤마로 구분하며
# 환경변수 미지정 시 로컬 Vite 개발 서버(5173 포트)를 기본값으로 허용한다 —
# app.jwt.access-token-ttl과 동일한 "환경변수 우선 + 기본값" 패턴이다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# SPEC-ENROLLMENT-001 plan.md §C.1 / design.md §1.1 — 부분 유니크 인덱스(WHERE
# 절)는 Hibernate ddl-auto가 생성하지 못하므로 schema.sql로 보강한다. ddl-auto가
# 먼저 테이블을 만든 뒤에 schema.sql이 실행되어야 하므로 defer-datasource-
# initialization을 켠다. sql.init.mode=always는 Testcontainers(비-임베디드) DB에서도
# schema.sql이 실행되게 한다(기본값 embedded는 임베디드 DB에서만 실행).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# 접수 잠금 활성화 스위치 (plan.md §E 사전 점검 4번 / research.md §6-4 대조군).
# 기본값 true — AC-ENR-007 대조군 테스트만 false로 오버라이드한다.
app.enrollment.lock-enabled=true

# 워커 스케줄러 설정값 (design.md §6 산출표, REQ-WRK-015, AC-ENR-022).
# polling-delay-ms=200 · batch-size=200 → 이론 처리량 1,000건/초. 테스트
# 프로파일은 scheduler-enabled=false로 오버라이드해(AbstractIntegrationTest)
# @Scheduled 자동 폴링을 끄고 drainQueue()를 명시적으로 호출한다
# (research.md §5 타이밍 의존 테스트 배제 원칙).
app.enrollment.worker.scheduler-enabled=true
app.enrollment.worker.polling-delay-ms=200
app.enrollment.worker.batch-size=200
